name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Minimum supported Rust
        run: cargo +1.95.0 check --workspace --all-targets --all-features --locked

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install dependency policy tool
        uses: taiki-e/install-action@849bd009f730a24e9db18262f4e9f062591dee39 # v2.61.5
        with:
          tool: cargo-deny@0.20.2
      - name: Dependency policy
        run: cargo deny check
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Production panic policy
        run: cargo clippy --lib --bins --all-features --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Bounded stress proof
        run: cargo test --release --locked --test stress -- --ignored
      - name: Sense scale and concurrent-worktree proofs
        run: cargo test --release --locked --test sense_stress -- --ignored --nocapture --test-threads=1
      - name: Release artifact
        env:
          OPCORE_DIST_DIR: ${{ runner.temp }}/opcore-dist
        run: scripts/build-release.sh
      - name: Installer
        run: scripts/test-install.sh "${{ runner.temp }}/opcore-dist/opcore"
      - name: Set up Node 18 for packaged installer integration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"
          package-manager-cache: false
      - name: npm facade with the release binary
        working-directory: npm/opcore
        env:
          OPCORE_TEST_BINARY: ${{ runner.temp }}/opcore-dist/opcore
        run: npm test
      - name: Self assessment
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/opcore-self-cache
        run: |
          binary="${RUNNER_TEMP}/opcore-dist/opcore"
          "$binary" check --repo . --all --json > "${RUNNER_TEMP}/opcore-self-check.json"
          "$binary" sense --repo . --json --advisory --allow-partial > "${RUNNER_TEMP}/opcore-self-sense.json"
          python3 - <<'PY'
          import json, os
          root = os.environ["RUNNER_TEMP"]
          with open(f"{root}/opcore-self-check.json", encoding="utf-8") as source:
              check = json.load(source)
          assert check["status"] == "clean" and not check["diagnostics"] and not check["coverage"]["gaps"]
          with open(f"{root}/opcore-self-sense.json", encoding="utf-8") as source:
              sense = json.load(source)
          assert not sense["introducedCycles"] and not sense["introducedDuplicates"]
          assert not sense["interfaceFindings"] and not sense["documentationRequirements"]
          PY
      - name: Bundle Linux release
        id: linux-release
        env:
          DIST_DIR: ${{ runner.temp }}/opcore-dist
        run: |
          archive=$(scripts/bundle-release.sh "$DIST_DIR" "$RUNNER_TEMP")
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$(basename "$archive" .tar.gz)" >> "$GITHUB_OUTPUT"
      - name: Validate Linux bundle with npm extractor
        run: node npm/opcore/test/bundle-smoke.js "${{ steps.linux-release.outputs.archive }}"
      - name: Packed npm installation and failure recovery
        env:
          OPCORE_TEST_BUNDLE: ${{ steps.linux-release.outputs.archive }}
        run: node --test npm/opcore/test/lifecycle.test.js
      - name: Linux release user journey
        run: scripts/test-user-journey.sh "${{ steps.linux-release.outputs.archive }}"
      - name: Retain Linux release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.linux-release.outputs.artifact }}
          path: ${{ steps.linux-release.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install ShellCheck
        uses: taiki-e/install-action@849bd009f730a24e9db18262f4e9f062591dee39 # v2.61.5
        with:
          tool: shellcheck@0.11.0
      - name: Install actionlint
        run: |
          install -d "${RUNNER_TEMP}/bin"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "${RUNNER_TEMP}/bin" actionlint
          "${RUNNER_TEMP}/bin/actionlint" -version
          printf '%s\n' "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Shell scripts
        run: shellcheck --severity=style scripts/*.sh
      - name: Workflows
        run: actionlint -shellcheck 'shellcheck --severity=style {0}' .github/workflows/*.yml

  npm-facade:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Test npm facade
        working-directory: npm/opcore
        run: npm test
      - name: Pack npm facade
        working-directory: npm/opcore
        run: npm run pack:smoke

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install coverage tool
        uses: taiki-e/install-action@849bd009f730a24e9db18262f4e9f062591dee39 # v2.61.5
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Coverage floor
        run: >-
          cargo llvm-cov --workspace --all-features --locked --summary-only
          --fail-under-lines 90 --fail-under-file-lines 65

  portability:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: macOS tests
        run: cargo test --workspace --all-features --locked
      - name: macOS release artifact
        env:
          OPCORE_DIST_DIR: ${{ runner.temp }}/opcore-dist
        run: scripts/build-release.sh
      - name: macOS installer
        run: scripts/test-install.sh "${{ runner.temp }}/opcore-dist/opcore"
      - name: Bundle macOS release
        id: macos-release
        env:
          DIST_DIR: ${{ runner.temp }}/opcore-dist
        run: |
          archive=$(scripts/bundle-release.sh "$DIST_DIR" "$RUNNER_TEMP")
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$(basename "$archive" .tar.gz)" >> "$GITHUB_OUTPUT"
      - name: Validate macOS bundle with npm extractor
        run: node npm/opcore/test/bundle-smoke.js "${{ steps.macos-release.outputs.archive }}"
      - name: Packed npm installation and failure recovery
        env:
          OPCORE_TEST_BUNDLE: ${{ steps.macos-release.outputs.archive }}
        run: node --test npm/opcore/test/lifecycle.test.js
      - name: macOS release user journey
        run: scripts/test-user-journey.sh "${{ steps.macos-release.outputs.archive }}"
      - name: Retain macOS release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.macos-release.outputs.artifact }}
          path: ${{ steps.macos-release.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and check documentation
        run: scripts/build-docs.sh
      - name: Upload documentation site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/site

  deploy-docs:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [msrv, verify, maintenance, npm-facade, coverage, portability, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [msrv, verify, maintenance, npm-facade, coverage, portability, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
      - name: Set up Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Download native releases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opcore-*
          path: ${{ runner.temp }}/opcore-publish
          merge-multiple: true
      - name: Validate release identity and assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REPOSITORY_VISIBILITY" != public ]]; then
            echo "::error::public npm installation requires public GitHub Release assets"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG already exists; refusing to replace its assets"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be stable semver: vX.Y.Z"
            exit 1
          fi
          version=${RELEASE_TAG#v}
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo version $cargo_version"
            exit 1
          fi
          release_dir="$RUNNER_TEMP/opcore-publish"
          linux="$release_dir/opcore-v${version}-linux-x86_64.tar.gz"
          macos="$release_dir/opcore-v${version}-macos-arm64.tar.gz"
          if [[ ! -f "$linux" || -L "$linux" || ! -f "$macos" || -L "$macos" ]]; then
            echo "::error::release requires exact Linux x64 and macOS arm64 archives"
            exit 1
          fi
          count=$(find "$release_dir" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
          if [[ "$count" -ne 2 ]]; then
            echo "::error::release artifact directory contains $count archives; expected 2"
            exit 1
          fi
          (
            cd "$release_dir"
            sha256sum \
              "$(basename "$linux")" \
              "$(basename "$macos")" > SHA256SUMS
          )
          node npm/opcore/test/stage-release.js "$version" "$linux" "$macos"
          npm pkg set "version=$version" --prefix npm/opcore
          if [[ $(node -p "require('./npm/opcore/package.json').version") != "$version" ]]; then
            echo "::error::failed to stage the npm package version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Retest staged npm package
        working-directory: npm/opcore
        run: |
          npm test
          npm run pack:smoke
      - name: Pack the exact npm release
        id: npm-package
        working-directory: npm/opcore
        env:
          RELEASE_DIR: ${{ runner.temp }}/opcore-publish
        run: |
          npm pack --ignore-scripts --pack-destination "$RELEASE_DIR"
          package="$RELEASE_DIR/the-open-engine-company-opcore-${{ steps.release.outputs.version }}.tgz"
          if [[ ! -f "$package" || -L "$package" ]]; then
            echo "::error::npm pack did not produce the expected regular archive"
            exit 1
          fi
          printf 'archive=%s\n' "$package" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub Release assets
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Opcore ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            ${{ runner.temp }}/opcore-publish/opcore-v${{ steps.release.outputs.version }}-linux-x86_64.tar.gz
            ${{ runner.temp }}/opcore-publish/opcore-v${{ steps.release.outputs.version }}-macos-arm64.tar.gz
            ${{ runner.temp }}/opcore-publish/SHA256SUMS
      - name: Test packed npm lifecycle against the release
        env:
          NPM_PACKAGE: ${{ steps.npm-package.outputs.archive }}
          OPCORE_AGENT: codex
        run: |
          journey=$(mktemp -d "$RUNNER_TEMP/opcore-npm-journey.XXXXXX")
          export HOME="$journey/home"
          export CODEX_HOME="$HOME/.codex"
          export npm_config_prefix="$journey/npm"
          mkdir -p "$CODEX_HOME"
          npm install -g "$NPM_PACKAGE"
          "$npm_config_prefix/bin/opcore" --version
          test -f "$CODEX_HOME/opcore/install.receipt"
          test -f "$CODEX_HOME/opcore/hook-install.json"
          "$npm_config_prefix/bin/opcore" uninstall
          npm uninstall -g @the-open-engine-company/opcore
          test ! -e "$CODEX_HOME/opcore/install.receipt"
          test ! -e "$CODEX_HOME/opcore/hook-install.json"
      - name: Publish npm facade
        env:
          NPM_PACKAGE: ${{ steps.npm-package.outputs.archive }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            export NODE_AUTH_TOKEN=$NPM_TOKEN
          else
            unset NODE_AUTH_TOKEN
          fi
          npm publish "$NPM_PACKAGE" --provenance --access public
